<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gobbler widget, local host</title>
    <style>
      body { margin: 0; padding: 24px 16px; font-family: system-ui, sans-serif; background: #faf9f5; color: #141413; }
      .wrap { max-width: 480px; margin: 0 auto; }
      h1 { font-size: 16px; font-weight: 500; margin: 0 0 4px; }
      p { font-size: 13px; color: #5e5d59; margin: 0 0 16px; }
      iframe { width: 100%; border: 0; display: block; }
      .bar { display: flex; gap: 8px; margin-bottom: 16px; }
      button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid #1f1e1d4d; background: transparent; cursor: pointer; }
      pre { font-size: 12px; white-space: pre-wrap; color: #5e5d59; margin: 16px 0 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Gobbler widget, local host</h1>
      <p>A stand-in for Claude. It talks to the Worker on port 8799 and shows the widget the way a chat would.</p>
      <div class="bar"><button id="open">start_game</button><button id="reset">reset_demo</button></div>
      <iframe id="view" title="Widget"></iframe>
      <pre id="log"></pre>
    </div>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
